<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeatWise — your heart sets the pace</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap');
:root{
  --bg:#FBF8F2; --panel:#FFFFFF; --panel2:#F3EFE7; --line:#C9C2B4;
  --text:#1C1B18; --dim:#575249;
  --push:#B4271A; --hold:#8A5A00; --recover:#155E8F; --rest:#1B6E3F;
  --pushBg:#C0392B; --holdBg:#A06800; --recoverBg:#1D6FA8; --restBg:#1E7A46;
  --gold:#B98F2E;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:'Atkinson Hyperlegible',system-ui,sans-serif; font-size:19px; line-height:1.45;
  padding:20px 14px 48px;}
.wrap{max-width:520px; margin:0 auto;}
.num{font-family:'Barlow Condensed',sans-serif; font-variant-numeric:tabular-nums;}
.hdr{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px;}
.logo{font-family:'Barlow Condensed',sans-serif; font-size:30px; font-weight:700; letter-spacing:.03em;}
.logo b{color:var(--push); font-weight:700;}
.nav button{background:none; border:none; cursor:pointer; font-size:18px; color:var(--dim);
  margin-left:16px; padding:8px 4px; font-family:inherit;}
.nav button.on{color:var(--text); font-weight:700; text-decoration:underline; text-underline-offset:4px;}
.panel{background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px;}
.panel2{background:var(--panel2); border:2px solid var(--line); border-radius:12px; padding:14px;}
.lbl{font-size:17px; font-weight:700; color:var(--text); margin-bottom:8px;}
.note{font-size:16px; color:var(--dim); margin-top:8px;}
.seg{display:flex; gap:8px; flex-wrap:wrap;}
.seg button{flex:1; min-height:56px; min-width:90px; padding:8px 6px; border-radius:10px; cursor:pointer;
  border:2px solid var(--line); background:var(--panel); color:var(--text);
  font-family:inherit; font-size:18px;}
.seg button.on{border-color:var(--text); background:var(--text); color:#fff; font-weight:700;}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:48px; background:transparent; cursor:pointer;}
input[type=range]::-webkit-slider-runnable-track{height:12px; border-radius:6px; background:#DCD5C7;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:34px; height:34px; border-radius:50%;
  background:var(--text); border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); margin-top:-11px;}
input[type=range]::-moz-range-track{height:12px; border-radius:6px; background:#DCD5C7;}
input[type=range]::-moz-range-thumb{width:34px; height:34px; border-radius:50%; background:var(--text); border:3px solid #fff;}
input[type=text]{width:100%; min-height:64px; font-size:26px; font-family:inherit; padding:10px 16px;
  border:2px solid var(--line); border-radius:12px; background:var(--panel); color:var(--text);}
.big-btn{width:100%; min-height:64px; padding:14px 0; border-radius:14px; border:none; cursor:pointer;
  background:var(--pushBg); color:#fff; font-size:24px; font-weight:700; font-family:'Barlow Condensed',sans-serif; letter-spacing:.04em;}
.big-btn:disabled{background:#C9C2B4; cursor:default;}
.ghost-btn{width:100%; min-height:56px; padding:12px 0; border-radius:12px; border:2px solid var(--line);
  background:var(--panel); color:var(--text); cursor:pointer; font-size:18px; font-family:inherit;}
.link-btn{background:none; border:none; cursor:pointer; color:var(--recover); font-size:18px; padding:8px 0;
  text-decoration:underline; text-underline-offset:3px; font-family:inherit;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.stat{background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center;}
@keyframes pgPulse{0%,100%{opacity:1}50%{opacity:.6}}
.pulse{animation:pgPulse 1.2s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){.pulse{animation:none!important;}}
#phaseBanner{border-radius:14px; padding:14px 18px; display:flex; justify-content:space-between;
  align-items:center; color:#fff; margin-bottom:16px;}
.workRow{display:flex; gap:14px; align-items:center;}
#bigTimer{font-size:96px; font-weight:700; line-height:1;}
h1.screen{font-family:'Barlow Condensed',sans-serif; font-size:34px; font-weight:700; margin:0 0 6px;}
.sumRow{font-size:18px; padding:8px 0; border-bottom:1px solid var(--line);}
.stepBtn{width:64px; height:64px; border-radius:12px; border:2px solid var(--line); background:var(--panel);
  font-size:30px; font-weight:700; cursor:pointer; color:var(--text); font-family:inherit;}
.rpeBtn{width:100%; min-height:76px; border-radius:14px; border:2px solid var(--line); background:var(--panel);
  font-size:22px; font-weight:700; cursor:pointer; margin-bottom:12px; font-family:inherit; color:var(--text);}
.planCard{border:3px solid var(--text); border-radius:14px; padding:18px; background:var(--panel); margin-bottom:16px;}
.hero{border:3px solid var(--text); border-radius:16px; padding:22px 18px; background:var(--panel);
  text-align:center; margin-bottom:16px;}
.heroNum{font-family:'Barlow Condensed',sans-serif; font-size:96px; font-weight:700; line-height:.95;}
.arrow{font-size:26px; font-weight:700;}
.barWrap{display:flex; gap:18px; align-items:flex-end; justify-content:center; height:150px; margin:14px 0 6px;}
.bar{width:96px; border-radius:10px 10px 4px 4px; display:flex; align-items:flex-start; justify-content:center;
  color:#fff; font-weight:700; font-size:22px; padding-top:8px; font-family:'Barlow Condensed',sans-serif;}
.barLbl{text-align:center; font-size:16px; color:var(--dim); width:96px;}
button:focus-visible, input:focus-visible{outline:3px solid var(--recover); outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="logo">BEAT<b>WISE</b></div>
    <div class="nav" id="navBox">
      <button id="navSetup" onclick="go('setup')">Home</button>
      <button id="navTrends" onclick="go('dash')">Progress</button>
    </div>
  </div>
  <div id="app"></div>
</div>

<script>
/* ================= state ================= */
const S = {
  screen:'setup',
  obStep:0, onboarded:false,
  name:'', age:68, sex:'female', restHR:64, activity:null,
  overrideMax:false, manualMax:170, observedMax:0,
  plan:null, planReason:'', showAdjust:false, showDetails:false,
  inputMode:'manual',
  hr:74, phase:'push', round:1, phaseStart:0, phaseTime:0, peak:0,
  rounds:[], completed:false, sessions:[], btStatus:'', lastSummary:null, pendingSession:null,
};
const PHASE = {
  push:   {label:'PUSH',    hex:'#C0392B', tip:'Work as hard as you comfortably can'},
  hold:   {label:'HOLD',    hex:'#A06800', tip:'Keep this same effort going'},
  recover:{label:'RECOVER', hex:'#1D6FA8', tip:'Slow right down, keep gently moving'},
  rest:   {label:'REST',    hex:'#1E7A46', tip:'Easy walking or slow pedaling'},
};
const ZCOLORS = ['#7A8B9C','#4E9484','#B98F2E','#C86A2E','#B4271A'];
const HOLD_STEPS=[15,20,30];
const WEEKLY_GOAL=3;

/* Max HR: women Gulati 2010 (206 - 0.88 x age), men Tanaka 2001 (208 - 0.7 x age).
   Real observed peaks override the formula. Zones: Karvonen (heart rate reserve). */
function estMax(){
  const f = Math.round(S.sex==='female' ? 206-0.88*S.age : 208-0.7*S.age);
  return Math.max(f, S.observedMax||0);
}
function maxHR(){ return S.overrideMax ? Math.max(S.manualMax, S.observedMax||0) : estMax(); }
function bands(){ return [0.5,0.6,0.7,0.8,0.9,1.0].map(p=>Math.round(S.restHR + p*(maxHR()-S.restHR))); }
function gateFloor(){ return bands()[S.plan.zone-1]; }
function recoverCeil(){ return bands()[1]; }
function fmt(s){ const m=Math.floor(s/60), r=Math.floor(s%60); return m>0? m+':'+String(r).padStart(2,'0') : r+'s'; }
function greeting(){
  const h=new Date().getHours();
  return (h<12?'Good morning':h<17?'Good afternoon':'Good evening')+(S.name?', '+S.name:'');
}

/* ================= first session & progression ================= */
function firstPlan(activity){
  if(activity==='low') return {zone:3, hold:15, rounds:3};
  if(activity==='med') return {zone:3, hold:15, rounds:4};
  return {zone:4, hold:15, rounds:5};
}
function evaluateSession(sess){
  if(!sess.completed) return ['down','Last time you stopped early, so today is one notch easier.'];
  const r=sess.rounds;
  const drift = r.length>=2 ? r[r.length-1].recover / Math.max(r[0].recover,1) : 1;
  if(sess.rpe==='hard') return ['same','You rated the last session very hard, so we repeat this level until it feels manageable.'];
  if(drift>1.4) return ['same','Your recovery slowed a lot by the final round last time, so we repeat this level.'];
  return ['up','You finished the last session strong, so today steps up.'];
}
function stepPlan(p, dir){
  const q={zone:p.zone, hold:p.hold, rounds:p.rounds};
  if(dir==='up'){
    if(q.rounds<6) q.rounds++;
    else if(q.hold<30){ q.hold=HOLD_STEPS[HOLD_STEPS.indexOf(q.hold)+1]; q.rounds=4; }
    else if(q.zone<5){ q.zone++; q.hold=15; q.rounds=4; }
    else if(q.rounds<8) q.rounds++;
  } else if(dir==='down'){
    if(q.rounds>3) q.rounds--;
    else if(q.hold>15){ q.hold=HOLD_STEPS[HOLD_STEPS.indexOf(q.hold)-1]; q.rounds=5; }
    else if(q.zone>3){ q.zone--; q.hold=30; q.rounds=5; }
  }
  return q;
}
function planText(p){ return 'Zone '+p.zone+' &middot; '+p.hold+'-second holds &middot; '+p.rounds+' rounds'; }

/* ================= insight math ================= */
/* Estimated heart rate recovery in the first minute (HRR1 proxy):
   we know how many beats they shed (gate to ceiling) and how long it took. */
function hrrOf(sess){
  if(!sess.gate || !sess.ceil || !sess.avgRecover) return null;
  const drop = sess.gate - sess.ceil, t = sess.avgRecover;
  if(t<=0) return null;
  return t<=60 ? Math.round(drop + 0.35*drop*(60-t)/60) : Math.round(drop*60/t);
}
function avgLast(arr, key, n){
  const xs = arr.slice(-n).map(key).filter(v=>v!=null);
  return xs.length? xs.reduce((a,b)=>a+b,0)/xs.length : null;
}
function avgFirst(arr, key, n){
  const xs = arr.slice(0,n).map(key).filter(v=>v!=null);
  return xs.length? xs.reduce((a,b)=>a+b,0)/xs.length : null;
}
function expectedHRR(age){ return Math.round(40 - 0.3*age); }
function heartAgeFromHRR(hrr){ return Math.max(25, Math.min(90, Math.round((40-hrr)/0.3))); }
function currentHRR(){ return avgLast(S.sessions, hrrOf, 3); }
function weekCount(){
  const wk=7*24*3600*1000, now=Date.now();
  return S.sessions.filter(s=>now-new Date(s.date).getTime()<wk).length;
}
/* which metric is the strength, which is the opportunity */
function pickFocus(){
  const hrr=currentHRR();
  if(hrr==null) return {strength:'consistency', opportunity:'recovery'};
  return hrr>=expectedHRR(S.age)
    ? {strength:'recovery', opportunity:'push'}
    : {strength:'consistency', opportunity:'recovery'};
}
function goalSentence(){
  const f=pickFocus();
  return f.opportunity==='recovery'
    ? 'Your aim: help your heart settle down faster after effort. Even one second quicker each week is a win.'
    : 'Your aim: make your heart harder to speed up. Try to add a second or two to your climb time.';
}

/* ================= persistence ================= */
let mem={};
function store(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
function load(k,d){ try{ const v=localStorage.getItem(k); return v!=null? JSON.parse(v):d; }catch(e){ return (k in mem)? mem[k]:d; } }
function loadAll(){
  S.sessions = load('pg-sessions',[]);
  const prof = load('pg-profile',null);
  if(prof){ Object.assign(S,{name:prof.name||'', age:prof.age, sex:prof.sex, restHR:prof.restHR, activity:prof.activity,
    overrideMax:!!prof.overrideMax, manualMax:prof.manualMax||170, observedMax:prof.observedMax||0});
    S.onboarded = !!(prof.onboarded || (prof.name && prof.activity)); }
  const pl = load('pg-plan',null);
  if(pl){ S.plan=pl.plan; S.planReason=pl.reason||''; }
}
function persist(){
  store('pg-sessions',S.sessions);
  store('pg-profile',{name:S.name,onboarded:S.onboarded,age:S.age,sex:S.sex,restHR:S.restHR,activity:S.activity,
    overrideMax:S.overrideMax,manualMax:S.manualMax,observedMax:S.observedMax});
  if(S.plan) store('pg-plan',{plan:S.plan,reason:S.planReason});
}
loadAll();

/* ================= audio ================= */
let actx=null;
function beep(f=880,d=0.18){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.value=f; g.gain.value=0.25;
    o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d);
    o.stop(actx.currentTime+d);
  }catch(e){}
}

/* ================= bluetooth ================= */
async function connectBT(){
  S.btStatus='Requesting device...'; render();
  try{
    const dev = await navigator.bluetooth.requestDevice({filters:[{services:['heart_rate']}]});
    const srv = await (await dev.gatt.connect()).getPrimaryService('heart_rate');
    const ch = await srv.getCharacteristic('heart_rate_measurement');
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged', e=>{
      const v=e.target.value, flags=v.getUint8(0);
      S.hr = (flags & 1) ? v.getUint16(1,true) : v.getUint8(1);
      if(S.screen==='workout') updateLive();
    });
    S.btStatus='Connected: '+(dev.name||'heart rate monitor'); S.inputMode='bluetooth';
  }catch(e){
    S.btStatus='Bluetooth did not connect here. It needs Chrome or Edge. Manual mode works with any watch.';
  }
  render();
}

/* ================= engine ================= */
let tickId=null, simId=null, curRound={};
function advance(to){
  beep(to==='hold'?1200 : to==='rest'?500 : 880);
  S.phase=to; S.phaseStart=Date.now(); S.phaseTime=0;
  paintPhase();
}
function startWorkout(){
  persist();
  S.rounds=[]; S.round=1; S.phase='push'; S.phaseStart=Date.now(); S.phaseTime=0;
  S.peak=0; S.completed=false;
  if(S.inputMode==='demo') S.hr=74;
  S.screen='workout'; beep(880); render();
  clearInterval(tickId); tickId=setInterval(tick,150);
  clearInterval(simId);
  if(S.inputMode==='demo') simId=setInterval(simTick,200);
}
function simTick(){
  const hard = S.phase==='push'||S.phase==='hold';
  const target = hard ? maxHR()*0.93 : maxHR()*0.52;
  const rate = hard ? 0.035 : 0.045;
  S.hr = Math.max(55, Math.min(maxHR()+3, S.hr + (target-S.hr)*rate + (Math.random()-0.5)*1.2));
  updateLive();
}
function tick(){
  if(S.screen!=='workout') return;
  S.phaseTime = (Date.now()-S.phaseStart)/1000;
  if(S.inputMode!=='demo') S.peak=Math.max(S.peak, S.hr);
  const h=S.hr, p=S.phase;
  if(p==='push' && h>=gateFloor()){
    curRound={round:S.round, push:+S.phaseTime.toFixed(1)};
    advance('hold');
  } else if(p==='hold' && S.phaseTime>=S.plan.hold){
    advance('recover');
  } else if(p==='recover' && h<=recoverCeil()){
    curRound.recover=+S.phaseTime.toFixed(1);
    S.rounds.push(curRound);
    if(S.round>=S.plan.rounds){ S.completed=true; endWorkout(); return; }
    advance('rest'); paintRounds();
  } else if(p==='rest' && S.phaseTime>=S.plan.hold*2){
    S.round++; advance('push');
  }
  updateLive();
}
function endWorkout(){
  clearInterval(tickId); clearInterval(simId);
  const done=S.rounds.filter(r=>r.recover!=null);
  if(done.length===0){ go('setup'); return; }
  if(S.inputMode!=='demo' && S.peak>maxHR()){ S.observedMax=Math.round(S.peak); }
  const avgPush=done.reduce((a,r)=>a+r.push,0)/done.length;
  const avgRec=done.reduce((a,r)=>a+r.recover,0)/done.length;
  S.pendingSession={
    date:new Date().toISOString(), maxHR:maxHR(), restHR:S.restHR,
    gate:gateFloor(), ceil:recoverCeil(),
    plan:{zone:S.plan.zone,hold:S.plan.hold,rounds:S.plan.rounds},
    completed:S.completed, rounds:done, peak:Math.round(S.peak),
    avgPush:+avgPush.toFixed(1), avgRecover:+avgRec.toFixed(1),
    fitness:+(avgPush/avgRec).toFixed(3),
  };
  S.screen='rpe'; render();
}
function submitRPE(v){
  const sess=S.pendingSession; sess.rpe=v;
  const isFirst = S.sessions.length===0;
  S.sessions.push(sess); S.lastSummary=sess; S.pendingSession=null;
  const [dir,reason]=evaluateSession(sess);
  S.plan = dir==='same' ? {zone:sess.plan.zone,hold:sess.plan.hold,rounds:sess.plan.rounds}
                        : stepPlan(sess.plan, dir);
  S.planReason=reason;
  persist();
  S.screen = isFirst ? 'findings' : 'summary';
  render();
}
function go(sc){
  if(S.screen==='workout'){ clearInterval(tickId); clearInterval(simId); }
  S.screen=sc; render();
}

/* ================= live DOM updates ================= */
function updateLive(){
  const el=id=>document.getElementById(id);
  if(!el('bigTimer')) return;
  const gated = S.phase==='push'||S.phase==='recover';
  const remaining = S.phase==='hold' ? Math.max(0,S.plan.hold-S.phaseTime)
                  : S.phase==='rest' ? Math.max(0,S.plan.hold*2-S.phaseTime) : S.phaseTime;
  el('bigTimer').textContent = fmt(gated? S.phaseTime : remaining);
  el('hrNum') && (el('hrNum').textContent=Math.round(S.hr));
  el('hrSlider') && (el('hrSlider').value=Math.round(S.hr));
  el('ladder') && (el('ladder').innerHTML=ladderSVG());
}
function paintPhase(){
  const el=id=>document.getElementById(id);
  const m=PHASE[S.phase];
  if(!el('phaseBanner')) return;
  el('phaseBanner').style.background=m.hex;
  el('phaseLabel').textContent=m.label;
  el('roundLabel').textContent='Round '+S.round+' of '+S.plan.rounds;
  el('bigTimer').style.color=m.hex;
  const gated=S.phase==='push'||S.phase==='recover';
  el('bigTimer').className = gated? 'num pulse':'num';
  el('timerMode').textContent = gated? 'Waiting on your heart, not a clock':'Counting down';
  el('instruction').textContent =
    S.phase==='push' ? 'Work hard until your heart reaches '+gateFloor() :
    S.phase==='hold' ? 'Hold this effort' :
    S.phase==='recover' ? 'Slow down until your heart drops to '+recoverCeil() : 'Easy movement';
  el('tip').textContent=m.tip;
}
function paintRounds(){
  const el=document.getElementById('roundsList');
  if(!el) return;
  el.parentElement.style.display = S.rounds.length? 'block':'none';
  el.innerHTML = S.rounds.map(r=>
    '<div class="sumRow">Round '+r.round+': <b style="color:var(--push)">'+r.push+'s</b> up &middot; <b style="color:var(--rest)">'+r.recover+'s</b> down</div>'
  ).join('');
}
window.nudgeHR=d=>{ S.hr=Math.max(50,Math.min(maxHR()+12,S.hr+d)); updateLive(); };

/* ================= zone ladder ================= */
function ladderSVG(){
  const H=240, b=bands(), min=b[0]-15, max=b[5]+8;
  const y=v=>H-((v-min)/(max-min))*H;
  let s='';
  for(let i=0;i<5;i++){
    s+='<rect x="26" y="'+y(b[i+1])+'" width="24" height="'+(y(b[i])-y(b[i+1]))+'" rx="3" fill="'+ZCOLORS[i]+'" opacity="'+(S.plan.zone===i+1?1:0.28)+'"/>';
    s+='<text x="56" y="'+(y(b[i])-2)+'" fill="var(--dim)" font-size="13" font-weight="700">Z'+(i+1)+'</text>';
  }
  s+='<line x1="18" x2="58" y1="'+y(gateFloor())+'" y2="'+y(gateFloor())+'" stroke="var(--push)" stroke-width="3" stroke-dasharray="5 4"/>';
  s+='<line x1="18" x2="58" y1="'+y(recoverCeil())+'" y2="'+y(recoverCeil())+'" stroke="var(--rest)" stroke-width="3" stroke-dasharray="5 4"/>';
  const hy=y(Math.min(Math.max(S.hr,min),max));
  s+='<g transform="translate(0,'+hy+')"><polygon points="8,0 22,-8 22,8" fill="var(--text)"/><text x="0" y="-11" fill="var(--text)" font-size="15" font-weight="700" class="num">'+Math.round(S.hr)+'</text></g>';
  return s;
}

/* ================= ring + trend charts ================= */
function ringSVG(done, goal){
  const R=62, CIRC=2*Math.PI*R, frac=Math.min(done/goal,1);
  return '<svg viewBox="0 0 160 160" style="width:150px;height:150px">'
    +'<circle cx="80" cy="80" r="'+R+'" fill="none" stroke="#E4DECF" stroke-width="16"/>'
    +'<circle cx="80" cy="80" r="'+R+'" fill="none" stroke="'+(frac>=1?'#1B6E3F':'#C0392B')+'" stroke-width="16" stroke-linecap="round" '
    +'stroke-dasharray="'+(CIRC*frac)+' '+CIRC+'" transform="rotate(-90 80 80)"/>'
    +'<text x="80" y="74" text-anchor="middle" font-size="40" font-weight="700" fill="var(--text)" font-family="Barlow Condensed">'+done+' of '+goal+'</text>'
    +'<text x="80" y="100" text-anchor="middle" font-size="15" fill="var(--dim)">this week</text>'
    +'</svg>';
}
function trendSVG(keys, colors, height){
  const data=S.sessions, W=460, H=height, P=32;
  if(data.length===0) return '';
  let vals=[]; keys.forEach(k=>data.forEach(d=>vals.push(d[k])));
  const lo=Math.min(...vals)*0.9, hi=(Math.max(...vals)*1.1)||1;
  const x=i=> data.length===1 ? W/2 : P+(i/(data.length-1))*(W-2*P);
  const y=v=> H-P-((v-lo)/(hi-lo))*(H-2*P);
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  for(let g=0; g<=3; g++){
    const gy=P+g*(H-2*P)/3, gv=(hi-(g/3)*(hi-lo));
    s+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+gy+'" y2="'+gy+'" stroke="#D8D1C2" stroke-dasharray="4 4"/>';
    s+='<text x="2" y="'+(gy+4)+'" fill="var(--dim)" font-size="12">'+gv.toFixed(1)+'</text>';
  }
  keys.forEach((k,ki)=>{
    const pts=data.map((d,i)=>x(i)+','+y(d[k])).join(' ');
    s+='<polyline points="'+pts+'" fill="none" stroke="'+colors[ki]+'" stroke-width="3"/>';
    data.forEach((d,i)=>{ s+='<circle cx="'+x(i)+'" cy="'+y(d[k])+'" r="4" fill="'+colors[ki]+'"/>'; });
  });
  data.forEach((d,i)=>{ s+='<text x="'+x(i)+'" y="'+(H-8)+'" fill="var(--dim)" font-size="12" text-anchor="middle">#'+(i+1)+'</text>'; });
  s+='</svg>';
  return s;
}

function exportData(){
  const blob=new Blob([JSON.stringify({profile:{name:S.name,age:S.age,sex:S.sex,restHR:S.restHR,observedMax:S.observedMax},sessions:S.sessions},null,2)],{type:'application/json'});

}

function segHTML(opts, cur, fn, labels){
  return '<div class="seg">'+opts.map((o,i)=>

  ).join('')+'</div>';
}

function refreshEst(){
  const el=id=>document.getElementById(id);
  el('ageOut')&&(el('ageOut').textContent='Age: '+S.age);

function pct(a,b,lowerBetter){
  if(a==null||b==null||a===0) return null;
  const p=Math.round(((b-a)/a)*100);
  return lowerBetter? -p : p;  /* positive result always means improvement */
}
function dashHTML(){
  const n=S.sessions.length;
  let s=`<h1 class="screen">Your progress${S.name?', '+S.name:''}</h1>`;
  if(n===0){
    return s+'<div class="panel" style="border-style:dashed;text-align:center;color:var(--dim)">No workouts yet. Finish one and this page comes alive.</div>';
  }
  const hrr=currentHRR(), exp=expectedHRR(S.age);
  const ha = hrr!=null? heartAgeFromHRR(hrr):null;
  const wk=weekCount();
  const focus=pickFocus();

  /* HERO: heart age */
  if(ha!=null){
    const younger = ha<S.age;
    s+=`<div class="hero">
      <div style="font-size:18px;color:var(--dim)">Your heart recovers like a typical</div>
      <div class="heroNum" style="color:${younger?'var(--rest)':'var(--push)'}">${ha}</div>
      <div style="font-size:20px;font-weight:700">year old&rsquo;s</div>
      <div style="font-size:18px;margin-top:8px">${younger
        ? 'That is <b>'+(S.age-ha)+' years younger</b> than your age. Wonderful.'
        : 'Every session of this training is built to bring this number down.'}</div>
      <div class="note">A friendly estimate from your recovery speed, not a medical measurement.</div>
    </div>`;
  }

  /* CELEBRATE + RING */
  s+=`<div class="panel" style="display:flex;gap:14px;align-items:center">
    ${ringSVG(wk, WEEKLY_GOAL)}
    <div style="flex:1">
      <div style="font-size:22px;font-weight:700">${wk>=WEEKLY_GOAL?'Week complete! &#127881;':'Showing up '+ String.fromCodePoint(0x2B06)}</div>
      <div class="note" style="font-size:17px">${
        focus.strength==='recovery' && hrr!=null
        ? 'Your recovery speed of about '+hrr+' beats per minute is <b>better than typical for your age</b> (around '+exp+'). Worth celebrating.'
        : 'Consistency is the single most powerful thing at any age, and the ring only cares that you showed up.'}</div>
    </div>
  </div>`;

  /* THEN vs NOW (after 3 sessions) */
  if(n>=4){
    const lowerBetter = focus.opportunity==='recovery';
    const key = lowerBetter? (x=>x.avgRecover) : (x=>x.avgPush);
    const base=avgFirst(S.sessions,key,3), cur=avgLast(S.sessions,key,3);
    const imp=pct(base,cur,lowerBetter);
    if(base!=null&&cur!=null){
      const maxV=Math.max(base,cur);
      const h1=Math.max(30,140*base/maxV), h2=Math.max(30,140*cur/maxV);
      const good = imp>0;
      s+=`<div class="panel" style="text-align:center">
        <div style="font-size:22px;font-weight:700">${lowerBetter?'Calming down after effort':'Working before your heart gives in'}
          <span class="arrow" style="color:${good?'var(--rest)':'var(--dim)'}">${good?(lowerBetter?'&#11015;':'&#11014;'):''}</span></div>
        <div class="barWrap">
          <div><div class="bar" style="height:${h1}px;background:#9A937F">${base.toFixed(0)}s</div><div class="barLbl">When you started</div></div>
          <div><div class="bar" style="height:${h2}px;background:${good?'var(--restBg)':'var(--recoverBg)'}">${cur.toFixed(0)}s</div><div class="barLbl">Now</div></div>
        </div>
        <div style="font-size:18px">${
          imp>=10 && lowerBetter ? 'Your heart calms down <b>'+imp+'% faster</b> than when you started. That is the difference between resting at the top of the stairs and not needing to.'
          : imp>=10 ? 'It now takes <b>'+imp+'% more work</b> to tire your heart. Hills feel a little flatter.'
          : imp>0 ? 'Moving in the right direction. Small gains stack up.'
          : 'Holding steady. Sleep, heat, and caffeine all nudge these numbers day to day.'}</div>
      </div>`;
    }
  } else {
    s+=`<div class="panel" style="text-align:center;color:var(--dim)">
      <div style="font-size:20px;font-weight:700;color:var(--text)">Your before-and-after unlocks after workout ${Math.min(4,n+1)>3?4:'number 4'}</div>
      <div class="note">The first three sessions are your baseline. Everything after gets compared to them.</div>
    </div>`;
  }

  /* details */
  s+=`<button class="link-btn" onclick="toggleDetails()">${S.showDetails?'Hide the detailed charts':'See the detailed charts'}</button>`;
  if(S.showDetails){
    s+=`<div class="panel">
        <div class="lbl">Seconds to reach the zone <span style="color:var(--push)">&#9632;</span> and to recover <span style="color:var(--rest)">&#9632;</span></div>
        ${trendSVG(['avgPush','avgRecover'], ['#B4271A','#1B6E3F'], 230)}
      </div>
      <div class="panel">
        <div class="lbl">Fitness score <span style="color:var(--hold)">&#9632;</span></div>
        ${trendSVG(['fitness'], ['#8A5A00'], 160)}
      </div>
      <button class="ghost-btn" onclick="exportData()">Download a backup of my history</button>`;
  }
  return s;
}

/* ================= render ================= */
function render(){
  document.getElementById('navSetup').className = (S.screen==='setup')?'on':'';
  document.getElementById('navTrends').className = S.screen==='dash'?'on':'';
  document.getElementById('navBox').style.visibility = S.onboarded? 'visible':'hidden';
  const app=document.getElementById('app');
  const route = (!S.onboarded)? 'wizard' : S.screen;
  app.innerHTML = route==='wizard'? wizardHTML()
              : route==='setup'? setupHTML()
              : route==='settings'? settingsHTML()
              : route==='workout'? workoutHTML()
              : route==='rpe'? rpeHTML()
              : route==='findings'? findingsHTML()
              : route==='summary'? summaryHTML()
              : dashHTML();
  if(route==='workout'){ paintPhase(); paintRounds(); updateLive(); }
}
render();
</script>
</body>
</html>
